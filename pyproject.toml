[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralworld"
version = "0.2.0"
description = "A deterministic game world and learned state dynamics model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=1.0,<2",
    "numpy>=1.24,<3",
    "pygame>=2.5,<3",
    "torch>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
neuralworld-play = "game.play:main"
neuralworld-generate = "data.generate:main"
neuralworld-one-step = "experiments.one_step:main"

[tool.setuptools.packages.find]
include = ["game*", "data*", "models*", "experiments*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
